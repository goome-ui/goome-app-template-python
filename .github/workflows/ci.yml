name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-22.04
            python: "3.8"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GOOME_BACKEND: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install -r requirements.txt
      - name: run on the test backend
        run: |
          mkdir -p shots
          out=$(GOOME_TEST_SHOTS=shots GOOME_TEST_SCRIPT="screen 1280x720 1; 3 click 60,28; end 6" python main.py)
          echo "$out"
          ls shots | grep -q ppm
          if [ -d variants ]; then echo "$out" | grep -q "overlay mode"; fi
      - name: other templates
        if: hashFiles('variants/**') != ''
        run: |
          for v in variants/*/; do
            n=$(basename "$v")
            mkdir -p "shots-$n"
            GOOME_TEST_SHOTS="shots-$n" GOOME_TEST_SCRIPT="screen 1280x720 1; 2 hotkey alt+m; 3 click 100,140; end 6" python "$v/main.py"
            ls "shots-$n" | grep -q ppm
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.os }}-${{ matrix.python }}
          path: shots*/
          if-no-files-found: ignore
